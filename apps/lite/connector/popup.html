<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>moa-lite 연결</title>
<style>body{font:15px system-ui;min-width:300px;max-width:480px;margin:20px}button,input{padding:8px;margin:4px 0}section{margin:16px 0;overflow-wrap:anywhere}[hidden]{display:none}</style></head>
<body><main>
<h1 id="heading">moa-lite 앱 주소 연결</h1>
<p id="status" role="status"></p>
<section id="setup"><p id="current-origin"></p><button id="use-current" hidden>이 탭 주소로 연결</button>
<form id="address-form"><label for="address">앱 주소</label><input id="address" type="text" placeholder="https://내-앱.vercel.app" required><button type="submit">저장</button></form></section>
<section id="connected" hidden><p id="app-origin"></p><p id="connection-status"></p><button id="change-address">주소 변경</button> <button id="open-app">앱 열기</button></section>
<button id="grant-permission" hidden>권한 허용</button>
<section id="login-section" hidden><h2>로그인 사용 사이트</h2><p>허용한 사이트에만 로그인 쿠키를 사용합니다.</p><label id="login-toggle-label" hidden><input id="login-toggle" type="checkbox">이 사이트에 로그인 쿠키 사용 <span id="login-origin"></span></label><ul id="login-sites"></ul></section>
</main><script src="popup.js"></script></body></html>
