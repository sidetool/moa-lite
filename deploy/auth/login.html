<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="moa-lite">
  <title>로그인 · moa-lite</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/__moa/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/__moa/login.css">
  <script src="/__moa/login.js" defer></script>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="moa-lite 홈"><span>moa-lite</span></a>
    <section class="panel" aria-labelledby="title">
      <h1 id="title">{{TITLE}}</h1>
      <p class="description">{{DESCRIPTION}}</p>
      <p class="error" role="alert">{{ERROR}}</p>
      <form method="post" action="/__moa/login" {{LOGIN_HIDDEN}}>
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <input type="hidden" name="next" value="{{NEXT}}">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" value="{{USERNAME}}" required autofocus maxlength="128" autocapitalize="none" spellcheck="false">
        <label for="password">비밀번호</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
          <button class="reveal" type="button" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
        </div>
        <label class="remember"><input type="checkbox" name="remember" checked><span>이 브라우저에서 로그인 유지</span></label>
        <button class="submit" type="submit">로그인</button>
        <p class="alt">초대를 받았나요? <a href="/__moa/join">초대 코드로 가입</a></p>
        <p class="hint">로그인 상태가 1년 동안 유지됩니다.<br>함께 쓰는 기기에서는 로그인 유지를 해제하세요.</p>
      </form>
      <div class="account" {{ACCOUNT_HIDDEN}}>
        <p><strong>{{USERNAME}}</strong> 계정으로 로그인되어 있습니다.</p>
        <a class="submit" href="/">moa-lite 열기</a>
        <form method="post" action="/__moa/logout">
          <input type="hidden" name="csrf" value="{{CSRF}}">
          <button class="logout" type="submit">이 브라우저에서 로그아웃</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
