<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="moa-lite">
  <title>가입 · moa-lite</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/__moa/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/__moa/login.css">
  <script src="/__moa/login.js" defer></script>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="moa-lite 홈"><span>moa-lite</span></a>
    <section class="panel" aria-labelledby="title">
      <p class="eyebrow">초대받으셨군요</p>
      <h1 id="title">moa-lite 계정 만들기</h1>
      <p class="description">내 계정에서 프로필을 만들고 이어보기와 내 목록을 따로 관리할 수 있어요.</p>
      <p class="error" role="alert">{{ERROR}}</p>
      <form method="post" action="/__moa/join" class="join">
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <div class="field">
          <label for="code">초대 코드</label>
          <input id="code" class="code-input" name="code" value="{{CODE}}" required maxlength="64" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
        </div>
        <div class="field">
          <label for="username">아이디</label>
          <input id="username" name="username" value="{{USERNAME}}" required minlength="2" maxlength="32" pattern="[a-zA-Z0-9._\-]{2,32}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-hint">
          <small id="username-hint">영문·숫자·. _ - 로 2~32자. 로그인할 때 써요.</small>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <div class="password-field">
            <input id="password" name="password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password" aria-describedby="password-hint">
            <button class="reveal" type="button" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
          </div>
          <small id="password-hint">8자 이상</small>
        </div>
        <div class="field">
          <label for="confirm">비밀번호 확인</label>
          <input id="confirm" name="confirm" type="password" required minlength="8" maxlength="1024" autocomplete="new-password">
          <small class="mismatch" hidden>비밀번호가 서로 달라요.</small>
        </div>
        <label class="remember"><input type="checkbox" name="remember" checked><span>이 브라우저에서 로그인 유지</span></label>
        <button class="submit" type="submit">가입하고 시작하기</button>
        <p class="alt">이미 계정이 있나요? <a href="/__moa/login">로그인</a></p>
      </form>
    </section>
  </main>
</body>
</html>
